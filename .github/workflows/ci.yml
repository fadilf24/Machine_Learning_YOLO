name: CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install ".[test]" black isort pylint pytest

      - name: Black Format Check
        run: black --check .

      - name: isort Check
        run: isort --check-only .

      - name: Pylint Check
        run: pylint bsort --fail-under=5

      - name: Run Tests
        run: pytest

      - name: Build Docker Image
        run: docker build -t bsort:latest .
